# Domain Manifest — hello-world instance
#
# The required keys, and the referential invariants binding this file to the
# filesystem, are specified by `kukamanga/docs/governance/domain-standard-v1.md`
# §7 and §7.1, and enforced by `tools/check-carveability.js` (JUNE-563).
#
# A non-empty `domain:` below is what scopes this tree as an *instance* rather
# than the mold — see §3.

domain: hello-world
owner_entity: runsnative   # the entity authoring this instance; a real customer install would set their own
version: 0.1.0
description: |
  The proving instance for the carveable-domain template. Exercises every
  layer (presentation → interface → behavior → services → adapters → ops →
  knowledge → tests) with minimal-but-real code.

exports:
  contracts:
    - interface/contracts/hello.openapi.yaml
  events: []
  surfaces:
    - behavior/surfaces/hello-surface.html

depends_on:
  runtime:
    - runsnative          # consumed via file:runsnative-0.2.0.tgz (vendored)
  services: []            # hello-world has no external services
  mcp_servers: []

slo:
  availability: "best-effort (local dev)"
  rpo: "n/a — stateless"
  rto: "n/a — stateless"

carveability:
  # Automated: `npm run check-carveability` (tools/check-carveability.js, JUNE-563)
  # enforces §5, §6, and the eight §7.1 referential invariants at instance scope.
  # Last audit (§7.1.8): checker green, `npm test` green (integration +
  # conformance), `npm run health` green, adapters/echo replaceable, state/ empty
  # and exportable.
  verified_at: "2026-07-10"

mcp_servers:
  - name: hello-mcp
    source: ./interface/mcp/hello-mcp
    version: 0.1.0
    pinned_at: 2026-05-29

i18n:
  default_locale: en
  supported_locales: [en, es]
  resolution: runtime
