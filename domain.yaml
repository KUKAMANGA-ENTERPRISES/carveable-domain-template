# Domain Manifest
#
# This file declares the domain's identity, what it exposes, and what it
# depends on. Fill it in when instantiating this template.
#
# The required keys, and the referential invariants binding this file to the
# filesystem (every `depends_on.services` entry has a matching `adapters/<name>/`
# folder; every `exports.contracts` path exists; etc.), are specified by
# `kukamanga/docs/governance/domain-standard-v1.md` §7 and §7.1.
#
# `tools/check-carveability.js` enforces them. It is one checker that reads the
# standard, not a script each domain writes for itself (built as JUNE-563).

domain: ""              # e.g. "hello-world", "harlow-pets", "publishing"
owner_entity: ""        # e.g. "runsnative", "mukadra", "himitsu-bako", or a new customer entity name
version: "0.0.0"

exports:
  contracts: []         # paths to interface/contracts/*.openapi.yaml or *.schema.json
  events: []            # event payload schemas this domain emits
  surfaces: []          # agent-facing surface paths (behavior/surfaces/*)

depends_on:
  runtime: []           # npm packages (e.g. "runsnative", "@mukadra/engine-client")
  services: []          # external services — each MUST have a matching adapters/<name>/
  mcp_servers: []       # MCP servers wired in .mcp.json (must match keys there)

slo:
  availability: ""      # e.g. "99.9%"
  rpo: ""               # recovery point objective
  rto: ""               # recovery time objective

carveability:
  # When this domain is handed off, the buyer should be able to:
  # - clone the repo
  # - npm install
  # - run `bash ops/health/check.sh` and see all green
  # - replace any adapter under adapters/ with their own implementation
  # If any of these break, the domain is not carveable.
  verified_at: ""       # ISO date of last carveability audit

# MCP servers exposed by this domain. Each entry declares a server under interface/mcp/<name>/.
# mcp_servers:
#   - name: <server-name>
#     source: ./interface/mcp/<server-name>
#     version: 0.1.0
#     pinned_at: <YYYY-MM-DD>

# Localization. Catalogs at i18n/<locale>/; locale-keyed data at state/data/seed/<locale>/.
# i18n:
#   default_locale: en
#   supported_locales: [en]
#   resolution: hybrid    # build-time | runtime | hybrid
