<!doctype html>
<html lang="en" data-run-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Hello World · Bundle test</title>

  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/site.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Roboto+Mono&display=swap">

  <!-- Pre-built bundle (the no-importmap path) — registers run-button as a side effect -->
  <script type="module" src="../vendor/run-button.bundle.js"></script>
</head>
<body>
  <div class="crumbs"><a href="../../">← hello-world</a></div>
  <h1>Bundle test (no importmap)</h1>

  <div class="section">
    <div class="section-label">Variants</div>
    <div class="row">
      <run-button variant="primary">Primary</run-button>
      <run-button variant="secondary">Secondary</run-button>
      <run-button variant="ghost">Ghost</run-button>
      <run-button variant="danger">Danger</run-button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Sizes</div>
    <div class="row">
      <run-button size="sm">Small</run-button>
      <run-button size="md">Medium</run-button>
      <run-button size="lg">Large</run-button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">States</div>
    <div class="row">
      <run-button disabled>Disabled</run-button>
      <run-button loading>Loading</run-button>
    </div>
  </div>
</body>
</html>
